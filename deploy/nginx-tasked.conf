server {
    listen 127.0.0.1:9444 ssl;
    server_name pix-study.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/pix-study/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pix-study/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 25m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Study's JS/CSS/SVG/TTF files are static and contain no session data.
    # Keep HTML lessons and JSON API responses outside this gzip location.
    location ~* \.(?:css|js|svg|ttf)$ {
        gzip on;
        gzip_proxied any;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_comp_level 1;
        gzip_types text/css application/javascript image/svg+xml font/ttf;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }

    location / {
        # Keep protected HTML (including lesson.html) on the application path;
        # server.js enforces the student session before serving lesson content.
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}

