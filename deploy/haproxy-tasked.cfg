global
    log /dev/log local0 warning
    maxconn 2048

defaults
    log global
    mode tcp
    timeout connect 5s
    timeout client 1m
    timeout server 1m

frontend public_https
    bind *:443
    tcp-request inspect-delay 5s
    tcp-request content accept if { req.ssl_hello_type 1 }
    acl is_tasked req.ssl_sni -i pix-study.duckdns.org
    use_backend tasked_https if is_tasked
    default_backend xray_reality

backend tasked_https
    server tasked_tls 127.0.0.1:9444

backend xray_reality
    server xray 127.0.0.1:4443

