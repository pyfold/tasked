services:
  db:
    image: postgres:16-alpine
    container_name: tasked-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: tasked
      POSTGRES_USER: tasked
      POSTGRES_PASSWORD: ${TASKED_DB_PASSWORD:?TASKED_DB_PASSWORD must be set in .env}
    volumes:
      - tasked_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasked -d tasked"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - tasked_internal
    mem_limit: 768m
    cpus: 0.35
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  tasked:
    build: .
    container_name: tasked-web
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PORT: "3000"
      NODE_ENV: production
      DATABASE_URL: postgresql://tasked:${TASKED_DB_PASSWORD}@db:5432/tasked
      DATABASE_SSL: "false"
    ports:
      - "127.0.0.1:3000:3000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 5s
      start_period: 20s
      retries: 3
    mem_limit: 1g
    cpus: 0.65
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - tasked_internal

networks:
  tasked_internal:
    internal: false

volumes:
  tasked_pgdata:

